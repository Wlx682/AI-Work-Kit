<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 工作流指挥中心 · AI-Work-Kit</title>
  <style>
    :root {
      --bg: #0A0C14;
      --bg-2: #0e1120;
      --panel: rgba(22, 27, 45, 0.55);
      --panel-solid: #141a2e;
      --stroke: rgba(120, 140, 200, 0.16);
      --stroke-strong: rgba(130, 150, 220, 0.32);
      --text: #e8ecf6;
      --muted: #8b93ad;
      --faint: #5a6178;
      --neon-a: #4d7cff;
      --neon-b: #9a5cff;
      --neon-c: #35e0d6;
      --red: #ff5470;
      --amber: #ffb547;
      --green: #35e08a;
      --blue: #4d9cff;
      --grad: linear-gradient(135deg, var(--neon-a), var(--neon-b));
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(1200px 700px at 80% -10%, rgba(77, 124, 255, 0.10), transparent 60%),
        radial-gradient(900px 600px at 0% 10%, rgba(154, 92, 255, 0.08), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: clamp(13px, 1vw + 9px, 15px);
      line-height: 1.5;
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(120, 140, 200, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120, 140, 200, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 0%, #000 40%, transparent 90%);
    }
    .wrap { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: clamp(16px, 3vw, 34px); }

    /* ---- top bar ---- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: clamp(14px, 2vw, 20px) clamp(16px, 2.4vw, 26px);
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 0.9rem; }
    .brand h1 { margin: 0; font-size: clamp(17px, 1.6vw, 22px); letter-spacing: 0.3px; }
    .brand .ver { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .light { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.03); }
    .light.red { background: var(--red); box-shadow: 0 0 14px var(--red), 0 0 0 4px rgba(255,84,112,0.12); animation: breathe 2.2s ease-in-out infinite; }
    .light.amber { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
    .light.green { background: var(--green); box-shadow: 0 0 12px var(--green); }
    @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    button {
      font: inherit; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,0.04); border: 1px solid var(--stroke-strong);
      padding: 0.5rem 0.9rem; border-radius: 10px; transition: 0.16s;
    }
    button:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); }
    button.primary { background: var(--grad); border: none; color: #fff; box-shadow: 0 4px 18px rgba(90,110,255,0.4); }
    button.ghost { background: transparent; }
    .search { position: relative; }
    .search input {
      font: inherit; color: var(--text); background: rgba(0,0,0,0.25);
      border: 1px solid var(--stroke); border-radius: 10px; padding: 0.5rem 0.8rem 0.5rem 2rem;
      width: clamp(140px, 20vw, 260px); outline: none;
    }
    .search input:focus { border-color: var(--neon-a); }
    .search::before { content: "🔍"; position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.8rem; }

    /* ---- KPI row ---- */
    .kpi-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      gap: clamp(12px, 1.6vw, 18px); margin-top: clamp(16px, 2.4vw, 24px);
    }
    .kpi {
      position: relative; overflow: hidden; padding: clamp(18px, 2.4vw, 28px);
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow);
      min-height: clamp(130px, 16vw, 160px); display: flex; flex-direction: column; justify-content: space-between;
    }
    .kpi::after { content: ""; position: absolute; inset: 0; background: var(--grad); opacity: 0.04; pointer-events: none; }
    .kpi .k-label { color: var(--muted); font-size: 0.82rem; display: flex; align-items: center; gap: 0.4rem; }
    .kpi .k-num {
      font-size: clamp(36px, 6vw, 52px); font-weight: 800; line-height: 1;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums; letter-spacing: -1px;
    }
    .kpi .k-num.plain { -webkit-text-fill-color: initial; background: none; color: var(--text); }
    .kpi .k-sub { color: var(--faint); font-size: 0.74rem; }
    .kpi .k-sub.up { color: var(--green); } .kpi .k-sub.down { color: var(--red); }
    .kpi.axiom .k-num { font-size: clamp(26px, 3.6vw, 38px); }
    .badge-low { font-size: 0.62rem; padding: 1px 6px; border-radius: 999px; background: rgba(255,181,71,0.14); color: var(--amber); border: 1px solid rgba(255,181,71,0.3); }
    .p-tiles { display: flex; gap: 0.5rem; }
    .p-tile { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--stroke); border-radius: 9px; padding: 0.4rem 0.5rem; text-align: center; }
    .p-tile b { display: block; font-size: clamp(15px, 1.8vw, 19px); color: var(--neon-c); font-variant-numeric: tabular-nums; }
    .p-tile span { font-size: 0.64rem; color: var(--faint); }

    /* ---- layout: main + sidebar ---- */
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 24vw, 320px); gap: clamp(14px, 2vw, 22px); margin-top: clamp(16px, 2.4vw, 24px); align-items: start; }
    @media (max-width: 1024px) { .stage { grid-template-columns: 1fr; } }

    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 0.8rem; font-size: clamp(14px, 1.3vw, 17px); }
    .section-title .filters { display: flex; gap: 0.4rem; }
    .chip { font-size: 0.72rem; padding: 0.3rem 0.7rem; border-radius: 999px; border: 1px solid var(--stroke); background: rgba(255,255,255,0.03); cursor: pointer; color: var(--muted); }
    .chip.on { background: var(--grad); color: #fff; border: none; }

    /* ---- epic health wall ---- */
    .wall { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(12px, 1.6vw, 18px); }
    .ecard {
      position: relative; text-align: left; display: block; width: 100%;
      padding: clamp(16px, 2vw, 22px); padding-left: calc(clamp(16px,2vw,22px) + 6px);
      background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow);
      transition: 0.18s; cursor: pointer; overflow: hidden;
    }
    .ecard:hover { transform: translateY(-3px); border-color: var(--stroke-strong); }
    .ecard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
    .ecard.red::before { background: var(--red); box-shadow: 0 0 16px var(--red); }
    .ecard.amber::before { background: var(--amber); }
    .ecard.green::before { background: var(--green); }
    .ecard.blue::before { background: var(--blue); }
    .ecard.archived::before { background: var(--faint); }
    .ecard.archived, .ecard.archived.fade-in.seen { opacity: 0.55; }
    .ecard.archived:hover, .ecard.archived.fade-in.seen:hover { opacity: 0.85; }
    .ecard .arch-tag { font-size: 0.66rem; padding: 2px 8px; border-radius: 999px; background: rgba(90,97,120,0.2); color: var(--muted); border: 1px solid var(--stroke); }
    .ecard .e-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.6rem; }
    .ecard .e-name { font-weight: 700; font-size: clamp(14px, 1.3vw, 16px); }
    .ecard .e-stage { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
    .ecard .e-stage code { color: var(--neon-c); background: rgba(53,224,214,0.1); padding: 1px 6px; border-radius: 5px; }
    .gate-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
    .gate-badge.fail { background: rgba(255,84,112,0.16); color: var(--red); border: 1px solid rgba(255,84,112,0.35); }
    .gate-badge.pass { background: rgba(53,224,138,0.16); color: var(--green); border: 1px solid rgba(53,224,138,0.35); }
    .progress { margin-top: 0.9rem; }
    .progress .bar { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.35); overflow: hidden; }
    .progress .bar i { display: block; height: 100%; border-radius: 999px; background: var(--grad); width: 0; transition: width 0.9s cubic-bezier(.2,.7,.2,1); }
    .progress .meta { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--faint); margin-top: 5px; }
    .blocker-hint { margin-top: 0.7rem; font-size: 0.76rem; color: var(--muted); display: flex; gap: 0.35rem; align-items: baseline; }
    .blocker-hint b { color: var(--amber); }
    .test-chip { margin-top: 0.55rem; display: inline-flex; gap: 0.35rem; align-items: center; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--stroke); color: var(--muted); background: rgba(0,0,0,0.18); }
    .test-chip.green { color: var(--green); border-color: rgba(53,224,138,0.35); background: rgba(53,224,138,0.08); }
    .test-chip.amber { color: var(--amber); border-color: rgba(255,181,71,0.35); background: rgba(255,181,71,0.08); }
    .test-chip.red { color: var(--red); border-color: rgba(255,84,112,0.35); background: rgba(255,84,112,0.08); }
    .test-meter { display: grid; gap: 0.55rem; }
    .test-meter .line { display: flex; justify-content: space-between; gap: 0.8rem; font-size: 0.78rem; color: var(--muted); }
    .test-meter b { color: var(--text); font-variant-numeric: tabular-nums; }
    .test-meter .mini-bar { height: 7px; border-radius: 999px; background: rgba(0,0,0,0.32); overflow: hidden; }
    .test-meter .mini-bar i { display: block; height: 100%; border-radius: 999px; background: var(--grad); width: 0; transition: width 0.7s cubic-bezier(.2,.7,.2,1); }
    .test-list { margin: 0.55rem 0 0; padding-left: 1rem; color: var(--muted); font-size: 0.75rem; }
    .test-list li { margin: 0.2rem 0; }

    /* ---- sidebar ---- */
    .side { display: flex; flex-direction: column; gap: clamp(12px, 1.6vw, 18px); position: sticky; top: 20px; }
    @media (max-width: 1024px) { .side { position: static; } }
    .spanel { padding: clamp(14px, 1.8vw, 20px); background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); }
    .spanel h3 { margin: 0 0 0.8rem; font-size: 0.86rem; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; }
    /* donut */
    .donut-wrap { display: flex; align-items: center; gap: 1rem; }
    .donut { --p: 0; width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(var(--red) 0 calc(var(--p1)*1%), var(--amber) 0 calc((var(--p1)+var(--p2))*1%), var(--green) 0 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 59%); mask: radial-gradient(farthest-side, transparent 58%, #000 59%);
      position: relative; }
    .donut-legend { font-size: 0.76rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .donut-legend span { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); } .dot.blue { background: var(--blue); }
    .topfail li { display: flex; align-items: center; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px dashed var(--stroke); font-size: 0.8rem; }
    .topfail li:last-child { border: none; }
    .topfail code { color: var(--red); }
    .topfail .cnt { font-variant-numeric: tabular-nums; color: var(--muted); }

    /* ---- timeline ---- */
    .timeline { list-style: none; margin: 0; padding: 0 0 0 1.1rem; position: relative; }
    .timeline::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 2px; background: linear-gradient(var(--stroke-strong), transparent); }
    .timeline li { position: relative; padding: 0 0 0.9rem 0.4rem; font-size: 0.78rem; }
    .timeline li::before { content: ""; position: absolute; left: -1.1rem; top: 5px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--bg-2); }
    .timeline li.fail::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .timeline li.pass::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .timeline li.progress-event::before { background: var(--neon-c); box-shadow: 0 0 8px var(--neon-c); }
    .timeline .tl-top { display: flex; gap: 0.5rem; align-items: baseline; }
    .timeline .tl-at { color: var(--faint); font-variant-numeric: tabular-nums; }
    .timeline .tl-stage code { color: var(--neon-c); }
    .timeline .tl-reason { color: var(--muted); margin-top: 2px; }
    .timeline .tl-commit { color: var(--faint); font-family: ui-monospace, monospace; font-size: 0.7rem; }

    /* ---- detail (level 2) ---- */
    .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: clamp(10px, 1.4vw, 16px); }
    .col { background: rgba(0,0,0,0.2); border: 1px solid var(--stroke); border-radius: 14px; padding: 0.7rem; }
    .col h4 { margin: 0.2rem 0 0.7rem; font-size: 0.82rem; display: flex; justify-content: space-between; }
    .col h4 .n { color: var(--faint); }
    .card { background: var(--panel-solid); border: 1px solid var(--stroke); border-radius: 11px; padding: 0.7rem 0.8rem; margin-bottom: 0.6rem; }
    .card.done { opacity: 0.6; } .card.running { border-color: var(--blue); box-shadow: 0 0 0 1px rgba(77,156,255,0.2); }
    .card.skipped { border-style: dashed; }
    .card h5 { margin: 0 0 0.3rem; font-size: 0.82rem; }
    .card .sub { color: var(--muted); font-size: 0.72rem; margin: 0.2rem 0 0; }
    .card .row-actions { margin-top: 0.5rem; display: flex; gap: 0.4rem; }
    .card .row-actions button { padding: 0.3rem 0.6rem; font-size: 0.72rem; min-height: 30px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--stroke); }
    th { color: var(--muted); font-weight: 600; }
    td code { font-size: 0.72rem; color: var(--neon-c); word-break: break-all; }
    select { font: inherit; color: var(--text); background: var(--panel-solid); border: 1px solid var(--stroke); border-radius: 8px; padding: 0.3rem; }
    .back { display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; }

    .empty { text-align: center; color: var(--muted); padding: 4rem 1rem; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120%); background: var(--panel-solid); border: 1px solid var(--stroke-strong); padding: 0.7rem 1.2rem; border-radius: 12px; box-shadow: var(--shadow); transition: 0.3s; z-index: 50; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .to-top { position: fixed; right: 22px; bottom: 22px; width: 42px; height: 42px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 40; }
    .to-top.show { display: flex; }

    .fade-in { opacity: 0; transform: translateY(14px); }
    .fade-in.seen { opacity: 1; transform: none; transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.7,.2,1); }
    #app.no-entry-motion .fade-in { opacity: 1; transform: none; transition: none; }
    #app.no-entry-motion .bar i, #app.no-entry-motion .mini-bar i { transition: none; }
    @media (prefers-reduced-motion: reduce) { .fade-in { opacity: 1 !important; transform: none !important; } .light.red { animation: none; } }

    button.danger { background: rgba(255,84,112,0.12); border: 1px solid rgba(255,84,112,0.4); color: var(--red); }
    button.danger:hover { background: rgba(255,84,112,0.22); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(5,7,14,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--panel-solid); border: 1px solid var(--stroke-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px,2.4vw,26px); max-width: min(92vw, 460px); }
    .modal .lead { color: var(--muted); font-size: 0.86rem; margin: 0 0 0.5rem; }
    .modal .cd-file { background: rgba(0,0,0,0.3); border: 1px solid var(--stroke); border-radius: 9px; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; }
    .modal .cd-file code { color: var(--red); word-break: break-all; font-size: 0.78rem; }
    .modal .cd-keep { font-size: 0.78rem; color: var(--green); margin-bottom: 0.8rem; }
    .modal .modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="light" id="healthLight"></span>
        <div>
          <h1>AI 工作流指挥中心</h1>
          <div class="ver" id="verLine">markdown 为唯一真相 · —</div>
        </div>
      </div>
      <div class="actions">
        <div class="search"><input id="searchBox" placeholder="搜索 Epic / 阶段 / 卡点…" /></div>
        <a class="navlink" href="/workflows" style="text-decoration:none;color:var(--text);background:rgba(255,255,255,0.04);border:1px solid var(--stroke-strong);padding:0.5rem 0.9rem;border-radius:10px;">⚙ 工作流管理</a>
        <a class="navlink" href="/tests" style="text-decoration:none;color:var(--text);background:rgba(255,255,255,0.04);border:1px solid var(--stroke-strong);padding:0.5rem 0.9rem;border-radius:10px;">测试中心</a>
        <button class="ghost" id="refreshBtn">刷新</button>
        <button class="primary" id="evolveBtn">⚡ 进化分析</button>
      </div>
    </div>
    <main id="app"><div class="empty">加载中…</div></main>
  </div>
  <div class="toast" id="toast"></div>
  <button class="to-top" id="toTop" title="返回顶部">↑</button>

  <script>
    let envelope = null;      // {epics, kpi, revision, updated_at}
    let view = 'overview';    // 'overview' | 'detail'
    let currentFile = null;   // epic.file in detail view
    let filter = 'all';       // all | attention | healthy
    let searchQ = '';

    const $ = id => document.getElementById(id);
    function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    let toastT;
    function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }

    const HEALTH_ORDER = { red: 0, amber: 1, blue: 2, green: 3, archived: 4 };
    const STAGE_ZH = { requirement: '需求', prioritization: '需求排序', architecture: '正式架构', 'story-split': 'Story 拆分/故事点', 'story-development': '逐 Story TDD', 'integration-test': '全量集成测试', design: '技术方案', 'test-first': '验收先行', split: '任务拆分', development: '功能开发', test: '自动化测试', deploy: '部署', done: '已完成', topic: '选题', theory: '理论输入', 'project-setup': '工程选型', 'tool-build': '工具实现', 'integration-run': '接入试跑', retro: '复盘' };
    const zhStage = k => STAGE_ZH[k] || k || '—';

    function boardContentSignature(data) {
      const { revision, updated_at, ...content } = data || {};
      return JSON.stringify(content);
    }

    async function loadBoard({ animate = true, skipUnchanged = false } = {}) {
      const res = await fetch('/api/board');
      const nextEnvelope = await res.json();
      if (skipUnchanged && envelope && boardContentSignature(nextEnvelope) === boardContentSignature(envelope)) {
        envelope = { ...envelope, revision: nextEnvelope.revision, updated_at: nextEnvelope.updated_at };
        $('verLine').textContent = `markdown 为唯一真相 · 同步 ${(envelope.updated_at || '').replace('T', ' ').slice(0, 19)}`;
        return false;
      }
      envelope = nextEnvelope;
      $('verLine').textContent = `markdown 为唯一真相 · 同步 ${(envelope.updated_at || '').replace('T', ' ').slice(0, 19)}`;
      const light = envelope.kpi?.overall_light || 'green';
      $('healthLight').className = 'light ' + light;
      draw(animate);
      return true;
    }

    function draw(animate = true) {
      $('app').classList.toggle('no-entry-motion', !animate);
      if (!envelope || !envelope.epics?.length) {
        $('app').innerHTML = '<div class="empty">Plans/Epic/ 下暂无 Epic。先实例化 Epic 母版。</div>';
        return;
      }
      if (view === 'detail') { renderDetail(); }
      else { renderOverview(animate); }
      observeFades(animate);
    }

    /* ============ Level 1: Overview ============ */
    function renderOverview(animate = true) {
      const k = envelope.kpi || {};
      const epics = envelope.epics.slice().sort((a, b) => (HEALTH_ORDER[a.health] ?? 9) - (HEALTH_ORDER[b.health] ?? 9));

      const low = k.sample_low ? '<span class="badge-low">样本不足</span>' : '';
      const passRate = k.pass_rate == null ? '—' : k.pass_rate;

      // 环形图三段占比（red/amber/green）
      const total = k.n_epics || 1;
      const p1 = Math.round((k.blocked && epics.filter(e => e.health === 'red').length || 0) / total * 100);
      const redN = epics.filter(e => e.health === 'red').length;
      const amberN = epics.filter(e => e.health === 'amber').length;
      const greenN = epics.filter(e => e.health === 'green' || e.health === 'blue').length;
      const dp1 = Math.round(redN / total * 100);
      const dp2 = Math.round(amberN / total * 100);

      const kpiRow = `
        <div class="kpi-row">
          <div class="kpi fade-in">
            <div class="k-label">📥 待推进 Epic</div>
            <div class="k-num" data-count="${k.blocked || 0}">0</div>
            <div class="k-sub">共 ${k.n_epics || 0} 个 · 其中 ${redN} 个亟需救火</div>
          </div>
          <div class="kpi fade-in">
            <div class="k-label">✅ 门禁通过率 ${low}</div>
            <div class="k-num" data-count="${passRate === '—' ? 0 : passRate}" data-suffix="%">0</div>
            <div class="k-sub">${k.gate_events || 0} 次判定累积</div>
          </div>
          <div class="kpi fade-in">
            <div class="k-label">⏱ 阶段停留（分位）<span class="badge-low">样本不足</span></div>
            <div class="p-tiles">
              <div class="p-tile"><b>—</b><span>P50</span></div>
              <div class="p-tile"><b>—</b><span>P90</span></div>
              <div class="p-tile"><b>—</b><span>P99</span></div>
            </div>
            <div class="k-sub">需累积 ≥10 条 pass/fail 后自动计算</div>
          </div>
          <div class="kpi axiom fade-in">
            <div class="k-label">🧭 核心法则</div>
            <div class="k-num plain">接口 &gt; 实现</div>
            <div class="k-sub">门禁只读文件事实 · 无状态不撒谎</div>
          </div>
        </div>`;

      const wall = epics.map(e => {
        const gh = e.gate_history || {};
        const storyMode = e.effective_workflow === 'client-dev';
        const pct = storyMode
          ? (e.story_points_total ? Math.round(e.story_points_done / e.story_points_total * 100) : 0)
          : (e.slices_total ? Math.round(e.slices_done / e.slices_total * 100) : 0);
        const consec = gh.consecutive_fails || 0;
        const badge = e.health === 'archived'
          ? '<span class="arch-tag">✓ 已归档</span>'
          : (gh.last_gate
            ? `<span class="gate-badge ${gh.last_gate.result}">${gh.last_gate.result === 'pass' ? '✅ 通过' : '⚠ 未过' + (consec >= 2 ? ' ×' + consec : '')}</span>`
            : '');
        const hint = e.blocker_hint && e.current_stage !== 'done'
          ? `<div class="blocker-hint">🚧 卡点 <b>${esc(e.blocker_hint)}</b></div>` : '';
        const th = e.test_health || {};
        const testLabel = storyMode
          ? (th.integration_pass ? '全量集成已通过' : `TDD ${th.story_done || 0}/${th.story_total || 0} Story`)
          : (th.coverage_pct == null ? '未建测试' : `测试 ${th.ac_covered || 0}/${th.ac_total || 0} AC`);
        const testChip = `<div class="test-chip ${esc(th.health || '')}">🧪 ${esc(testLabel)}</div>`;
        return `
          <button class="ecard ${e.health} fade-in" data-file="${esc(e.file)}">
            <div class="e-head">
              <div>
                <div class="e-name">${esc(e.name)}</div>
                <div class="e-stage">阶段 <code>${zhStage(e.current_stage)}</code></div>
              </div>
              ${badge}
            </div>
            <div class="progress">
              <div class="bar"><i data-w="${pct}"></i></div>
              <div class="meta"><span>${storyMode ? `${e.story_points_done || 0}/${e.story_points_total || 0} 点` : `${e.slices_done}/${e.slices_total} 切片`}</span><span>${pct}%</span></div>
            </div>
            ${hint}
            ${testChip}
          </button>`;
      }).join('');

      const lightweight = (envelope.lightweight || []).map(w => {
        const pct = w.stages_total ? Math.round(w.stages_done / w.stages_total * 100) : 0;
        const next = zhStage(w.current_stage);
        const plans = (w.stages || []).filter(s => s.plan).slice(0, 3).map(s => `<code>${esc(s.plan.path)}</code>`).join('<br>') || '暂无阶段 plan';
        return `
          <div class="ecard blue fade-in">
            <div class="e-head">
              <div>
                <div class="e-name">${esc(w.name)}</div>
                <div class="e-stage">当前 <code>${esc(next)}</code></div>
              </div>
              <span class="gate-badge ${w.blocked ? 'fail' : 'pass'}">${w.blocked ? '待创建阶段 plan' : '阶段齐备'}</span>
            </div>
            <div class="progress">
              <div class="bar"><i data-w="${pct}"></i></div>
              <div class="meta"><span>${w.stages_done}/${w.stages_total} 阶段</span><span>${pct}%</span></div>
            </div>
            <div class="blocker-hint">${plans}</div>
          </div>`;
      }).join('');

      // 全局门禁时间线（所有 Epic 最近事件合并，倒序）
      const allEvents = [];
      envelope.epics.forEach(e => (e.gate_history?.recent || []).forEach(ev => allEvents.push({ ...ev, epic: e.name })));
      allEvents.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
      const tl = allEvents.slice(0, 10).map(ev => `
        <li class="${ev.result}">
          <div class="tl-top"><span class="tl-at">${esc(ev.at)}</span> <span class="tl-stage"><code>${zhStage(ev.stage)}</code></span>${ev.inferred ? ' <span class="badge-low">推断</span>' : ''}</div>
          <div class="tl-reason">${ev.result === 'pass' ? '门禁通过' : esc(ev.reason || '未过')}${ev.passed_stages?.length ? ` · 已过 ${ev.passed_stages.map(zhStage).join(' / ')}` : ''}</div>
          <div class="tl-commit">${esc(ev.epic)} · ${esc(ev.git_commit || '')}</div>
        </li>`).join('') || '<li>暂无门禁事件</li>';

      const topfail = (k.top_blockers || []).map(b => `
        <li><code>${zhStage(b.stage)}</code><span class="cnt">×${b.count}</span></li>`).join('') || '<li>暂无失败记录</li>';

      $('app').innerHTML = `
        ${kpiRow}
        <div class="stage">
          <div>
            <div class="section-title">
              <span>Epic 健康度纵览</span>
              <span class="filters">
                <span class="chip ${filter === 'all' ? 'on' : ''}" data-f="all">全部</span>
                <span class="chip ${filter === 'attention' ? 'on' : ''}" data-f="attention">⚠ 需关注</span>
                <span class="chip ${filter === 'healthy' ? 'on' : ''}" data-f="healthy">✅ 健康</span>
              </span>
            </div>
            <div class="wall" id="wall">${wall}</div>
            <div class="section-title" style="margin-top:1.2rem"><span>轻流程任务</span><span class="badge-low">无 Epic 流程</span></div>
            <div class="wall">${lightweight || '<div class="empty">暂无轻流程任务</div>'}</div>
          </div>
          <aside class="side">
            <div class="spanel fade-in">
              <h3>状态分布</h3>
              <div class="donut-wrap">
                <div class="donut" style="--p1:${dp1};--p2:${dp2}"></div>
                <div class="donut-legend">
                  <span><i class="dot red"></i> 亟需救火 ${redN}</span>
                  <span><i class="dot amber"></i> 有阻塞 ${amberN}</span>
                  <span><i class="dot green"></i> 健康 ${greenN}</span>
                </div>
              </div>
            </div>
            <div class="spanel fade-in">
              <h3>门禁卡点 Top 3</h3>
              <ul class="topfail" style="list-style:none;margin:0;padding:0">${topfail}</ul>
            </div>
            <div class="spanel fade-in">
              <h3>门禁事件时间线</h3>
              <ul class="timeline">${tl}</ul>
            </div>
          </aside>
        </div>`;

      applyFilterAndSearch();
      // 交互绑定
      document.querySelectorAll('.ecard').forEach(c => c.onclick = () => { currentFile = c.dataset.file; view = 'detail'; window.scrollTo(0, 0); draw(); });
      document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.f; draw(); });
      // 动画：进度条 + count-up
      requestAnimationFrame(() => {
        document.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%');
        document.querySelectorAll('.mini-bar i').forEach(i => i.style.width = i.dataset.w + '%');
        document.querySelectorAll('.k-num[data-count]').forEach(el => {
          if (animate) countUp(el);
          else el.textContent = (el.dataset.count || '0') + (el.dataset.suffix || '');
        });
      });
    }

    function applyFilterAndSearch() {
      document.querySelectorAll('.ecard').forEach(c => {
        const e = envelope.epics.find(x => x.file === c.dataset.file);
        let ok = true;
        if (filter === 'attention') ok = e.health === 'red' || e.health === 'amber';
        if (filter === 'healthy') ok = e.health === 'green' || e.health === 'blue';
        if (ok && searchQ) {
          const hay = `${e.name} ${zhStage(e.current_stage)} ${e.blocker_hint}`.toLowerCase();
          ok = hay.includes(searchQ.toLowerCase());
        }
        c.style.display = ok ? '' : 'none';
      });
    }

    /* ============ Level 2: Detail ============ */
    function renderDetail() {
      const e = envelope.epics.find(x => x.file === currentFile);
      if (!e) { view = 'overview'; return renderOverview(); }
      const storyMode = e.effective_workflow === 'client-dev';
      const nextN = e.next_slice;
      const cols = { todo: [], running: [], done: [] };
      (storyMode ? (e.stories || []) : (e.slices || [])).forEach(s => {
        if (storyMode) cols[s.state || 'todo'].push(s);
        else if (s.done) cols.done.push(s);
        else if (s.n === nextN) cols.running.push(s);
        else cols.todo.push(s);
      });
      const colHtml = (title, arr, cls) => `
        <div class="col">
          <h4>${title} <span class="n">${arr.length}</span></h4>
          ${arr.map(s => `
            <div class="card ${cls} ${s.skipped ? 'skipped' : ''}">
              <h5>${storyMode ? `${esc(s.id)} · ${esc(s.title)}` : `WBS ${s.n} · ${s.skipped ? '已跳过 · ' : ''}${esc(s.title)}`}</h5>
              ${storyMode
                ? `<p class="sub">${esc(s.priority)} · ${esc(s.story_points)} 点 · ${s.sprint_scope ? 'Scope 内' : 'Scope 外'}${s.dependencies?.length ? ` · 依赖 ${esc(s.dependencies.join(', '))}` : ''}</p>`
                : (s.summary ? `<p class="sub">${esc(s.summary)}</p>` : '')}
              <div class="row-actions">
                ${storyMode ? `<button data-story="${esc(s.id)}">证据</button>` : `<button data-detail="${s.n}">细节</button>`}
                ${storyMode ? '' : (s.done
                  ? `<button data-slice="${s.n}" data-state="open">${s.skipped ? '恢复' : '重开'}</button>`
                  : `<button data-slice="${s.n}" data-state="done">完成</button>`)}
                ${!storyMode && !s.done && s.optional ? `<button data-slice="${s.n}" data-state="skipped">跳过</button>` : ''}
              </div>
            </div>`).join('') || '<p class="sub">无</p>'}
        </div>`;

      const plansRows = (e.plans || []).map(p => `
        <tr>
          <td>${esc(p.stage)}</td>
          <td>${p.path ? `<code>${esc(p.path)}</code>` : '—'}</td>
          <td>
            <select class="statusSel" data-plan="${esc(p.path || '')}">
              ${['草稿', '进行中', '评审中', '已采纳', '搁置'].map(o => `<option ${o === p.status ? 'selected' : ''}>${o}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('');
      const gh = e.gate_history || {};
      const tl = (gh.recent || []).map(ev => `
        <li class="${ev.result}">
          <div class="tl-top"><span class="tl-at">${esc(ev.at)}</span> <span class="tl-stage"><code>${zhStage(ev.stage)}</code></span> ${ev.result === 'pass' ? '✅' : '⚠'}${ev.inferred ? ' <span class="badge-low">推断</span>' : ''}</div>
          <div class="tl-reason">${ev.result === 'pass' ? '门禁通过' : esc(ev.reason || '未过')}${ev.passed_stages?.length ? ` · 已过 ${ev.passed_stages.map(zhStage).join(' / ')}` : ''}</div>
          ${ev.git_commit ? `<div class="tl-commit">commit ${esc(ev.git_commit)}</div>` : ''}
        </li>`).join('') || '<li>暂无门禁事件</li>';
      const ph = e.progress_history || {};
      const ptl = (ph.recent || []).map(ev => `
        <li class="progress-event">
          <div class="tl-top"><span class="tl-at">${esc(ev.at)}</span> <span class="tl-stage"><code>${zhStage(ev.stage)}</code></span></div>
          <div class="tl-reason">WBS ${esc(ev.slice)} → ${esc(ev.state)}${ev.previous_state ? `（原 ${esc(ev.previous_state)}）` : ''}</div>
          <div class="tl-commit">${esc(ev.label || '')}${ev.operator ? ` · ${esc(ev.operator)}` : ''}</div>
        </li>`).join('') || '<li>暂无 WBS 进度事件</li>';

      $('app').innerHTML = `
        <button class="ghost back" id="backBtn">← 返回纵览</button>
        <div class="topbar" style="margin-bottom:1.2rem">
          <div class="brand">
            <span class="light ${e.health}"></span>
            <div><h1 style="font-size:clamp(16px,1.5vw,20px)">${esc(e.name)}</h1>
            <div class="ver">阶段 ${zhStage(e.current_stage)} · ${storyMode ? `${e.story_points_done || 0}/${e.story_points_total || 0} 故事点` : `${e.slices_done}/${e.slices_total} 切片`} · ${esc(e.repo || '')} / ${esc(e.branch || '')}</div></div>
          </div>
          <div class="actions">
            <button class="primary" id="triggerBtn">复制续做命令</button>
            ${e.health === 'archived'
              ? '<button class="ghost" id="reactivateBtn">↻ 重新激活</button>'
              : '<button class="ghost" id="archiveBtn">✓ 结束归档</button>'}
            <button class="danger" id="deleteBtn">🗑 删除 Epic</button>
          </div>
        </div>
        <div class="stage">
          <div>
            <div class="section-title"><span>${storyMode ? '动态用户故事看板' : 'WBS 作战看板'}</span></div>
            <div class="grid4">
              ${colHtml('待开始', cols.todo, 'todo')}
              ${colHtml('进行中', cols.running, 'running')}
              ${colHtml('已完成', cols.done, 'done')}
            </div>
            <div class="spanel fade-in" style="margin-top:1.2rem">
              <h3>子 Plan 状态</h3>
              <table><thead><tr><th>阶段</th><th>路径</th><th>status</th></tr></thead><tbody>${plansRows}</tbody></table>
            </div>
          </div>
          <aside class="side">
            <div class="spanel fade-in">
              <h3>门禁事件时间线（本 Epic）</h3>
              <ul class="timeline">${tl}</ul>
            </div>
            <div class="spanel fade-in">
              <h3>WBS 进度事件</h3>
              <ul class="timeline">${ptl}</ul>
            </div>
          </aside>
        </div>`;

      $('backBtn').onclick = () => { view = 'overview'; currentFile = null; window.scrollTo(0, 0); draw(); };
      $('triggerBtn').onclick = async () => {
        const r = await fetch('/api/trigger', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: e.file }) });
        const d = await r.json();
        try { await navigator.clipboard.writeText(d.command); } catch (_) {}
        toast(`已复制：${d.command}`);
      };
      document.querySelectorAll('[data-slice]').forEach(b => b.onclick = () => setSliceState(e.file, +b.dataset.slice, b.dataset.state));
      document.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => {
        const s = e.slices.find(x => x.n === +b.dataset.detail);
        toast(`WBS ${s.n} · 验收：${s.acceptance || '—'} · skill：${s.skill || '—'}`);
      });
      document.querySelectorAll('[data-story]').forEach(b => b.onclick = () => {
        const s = e.stories.find(x => x.id === b.dataset.story);
        toast(`${s.id} · ${s.story_points} 点 · ${s.tdd_complete ? 'TDD 证据完整' : 'TDD 证据未完整'} · ${s.path || '未建子 Plan'}`);
      });
      document.querySelectorAll('.statusSel').forEach(sel => sel.onchange = () => setStatus(sel.dataset.plan, sel.value, e.file));
      const archiveBtn = $('archiveBtn'), reactivateBtn = $('reactivateBtn'), deleteBtn = $('deleteBtn');
      if (archiveBtn) archiveBtn.onclick = () => archiveEpic(e.file, true);
      if (reactivateBtn) reactivateBtn.onclick = () => archiveEpic(e.file, false);
      if (deleteBtn) deleteBtn.onclick = () => confirmDelete(e);
    }

    /* ============ 结束 / 删除 ============ */
    async function archiveEpic(file, archived) {
      await fetch('/api/epic-archive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file, archived }) });
      toast(archived ? '已结束归档' : '已重新激活');
      if (archived) { view = 'overview'; currentFile = null; }
      await loadBoard();
    }

    function confirmDelete(e) {
      const kids = (e.plans || []).map(p => p.path).filter(Boolean);
      const kidsNote = kids.length
        ? `<div class="cd-keep">保留 ${kids.length} 个子 Plan（需求/方案/开发/测试），不会删除。</div>`
        : '';
      const html = `
        <div class="modal-backdrop show" id="cdModal">
          <div class="modal">
            <h3 style="margin:0 0 0.6rem;color:var(--red)">⚠ 确认删除 Epic</h3>
            <p class="lead">将永久删除主文件：</p>
            <div class="cd-file"><code>${esc(e.file)}</code></div>
            ${kidsNote}
            <div class="modal-actions">
              <button class="ghost" id="cdCancel">取消</button>
              <button class="danger" id="cdOk">确认删除</button>
            </div>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      const close = () => document.getElementById('cdModal')?.remove();
      document.getElementById('cdCancel').onclick = close;
      document.getElementById('cdModal').onclick = ev => { if (ev.target.id === 'cdModal') close(); };
      document.getElementById('cdOk').onclick = async () => {
        close();
        const r = await fetch('/api/epic-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: e.file }) });
        const d = await r.json();
        if (d.ok) { toast('已删除 Epic 主文件'); view = 'overview'; currentFile = null; await loadBoard(); }
        else { toast('删除失败：' + (d.error || '未知')); }
      };
    }

    /* ============ actions ============ */
    async function setSliceState(file, n, state) {
      const r = await fetch('/api/slice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file, slice: n, state, operator: 'web' }) });
      const d = await r.json();
      if (!d.ok) { toast(`WBS ${n} 更新失败：${d.error || '未知'}`); return; }
      const label = state === 'done' ? '已完成' : (state === 'skipped' ? '已跳过' : '已恢复');
      toast(`WBS ${n} ${label}`);
      await loadBoard();
    }
    async function setStatus(planPath, status, epicFile) {
      await fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: planPath, status, epic: epicFile, stage: '—', operator: 'web' }) });
      toast(`${planPath} → ${status}`);
      await loadBoard();
    }

    /* ============ count-up ============ */
    function countUp(el) {
      const target = +el.dataset.count || 0;
      const suffix = el.dataset.suffix || '';
      const dur = 900; const t0 = performance.now();
      function step(t) {
        const p = Math.min(1, (t - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased) + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* ============ scroll fade + to-top ============ */
    let io;
    function observeFades(animate = true) {
      if (io) io.disconnect();
      const fades = document.querySelectorAll('.fade-in:not(.seen)');
      if (!animate) {
        fades.forEach(el => el.classList.add('seen'));
        document.querySelectorAll('.mini-bar i').forEach(i => i.style.width = i.dataset.w + '%');
        return;
      }
      io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('seen'); io.unobserve(x.target); } }), { threshold: 0.08 });
      fades.forEach(el => io.observe(el));
      requestAnimationFrame(() => document.querySelectorAll('.mini-bar i').forEach(i => i.style.width = i.dataset.w + '%'));
    }
    window.addEventListener('scroll', () => $('toTop').classList.toggle('show', window.scrollY > 300));
    $('toTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    /* ============ polling ============ */
    let lastRev = null;
    async function pollRevision() {
      try {
        const r = await fetch('/api/revision');
        const { revision } = await r.json();
        if (lastRev !== null && revision !== lastRev) await loadBoard({ animate: false, skipUnchanged: true });
        lastRev = revision;
      } catch (_) {}
    }
    setInterval(pollRevision, 4000);

    /* ============ wiring ============ */
    $('refreshBtn').onclick = loadBoard;
    $('evolveBtn').onclick = () => toast('进化分析：门禁卡点 Top1 = 功能开发（development）× 最多失败，建议优先补齐该阶段 WBS 切片');
    $('searchBox').addEventListener('input', e => { searchQ = e.target.value.trim(); if (view === 'overview') applyFilterAndSearch(); });

    loadBoard().then(() => { lastRev = envelope?.revision ?? null; })
      .catch(err => { $('app').innerHTML = `<div class="empty">加载失败：${err.message}<br>请先运行 ./scripts/kanban-server.sh</div>`; });
  </script>
</body>
</html>
