<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Epic 看板 · AI-Work-Kit</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --done: #22c55e;
      --todo: #64748b;
      --active: #f59e0b;
      --blocked: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    button, select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { padding: 1rem 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
    .meta {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;
      margin-bottom: 1rem; font-size: 0.85rem; color: var(--muted);
    }
    .meta span b { color: var(--text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    .col h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .card.done { border-left: 3px solid var(--done); }
    .card.active { border-left: 3px solid var(--active); }
    .card.todo { border-left: 3px solid var(--todo); }
    .card.blocked { border-left: 3px solid var(--blocked); }
    .card h3 { margin: 0 0 0.35rem; font-size: 0.9rem; }
    .card p { margin: 0; font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
    .card-actions { margin-top: 0.5rem; display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .card-actions button { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    section { margin-top: 1.5rem; }
    section > h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th, td {
      text-align: left; padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; }
    .toast {
      position: fixed; bottom: 1rem; right: 1rem;
      background: var(--surface); border: 1px solid var(--done);
      padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.85rem;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .empty { color: var(--muted); padding: 2rem; text-align: center; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center;
      padding: 1rem; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; max-width: 520px; width: 100%;
      max-height: 85vh; overflow: auto; padding: 1.25rem;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }
    .modal h2 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .modal .lead { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 1rem; }
    .detail-grid { display: grid; gap: 0.65rem; font-size: 0.85rem; }
    .detail-row { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.5rem; }
    .detail-row dt { color: var(--muted); margin: 0; }
    .detail-row dd { margin: 0; line-height: 1.45; }
    .modal code { font-size: 0.8rem; word-break: break-all; }
    .modal-actions { margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    .btn-link {
      background: transparent; border: none; color: var(--accent);
      padding: 0; font-size: 0.78rem; cursor: pointer; text-decoration: underline;
    }
    .btn-link:hover { color: #60a5fa; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Epic 看板</h1>
      <div class="sub">markdown 为唯一真相 · 写回 Obsidian 即时同步</div>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center;">
      <select id="epicSelect"></select>
      <button id="refreshBtn">刷新</button>
      <button class="primary" id="triggerBtn">复制续做命令</button>
    </div>
  </header>
  <main id="app"><div class="empty">加载中…</div></main>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="detailModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="detailTitle">
      <h2 id="detailTitle"></h2>
      <p class="lead" id="detailLead"></p>
      <dl class="detail-grid" id="detailBody"></dl>
      <div class="modal-actions">
        <button type="button" id="detailCopyPlan">复制 plan 路径</button>
        <button type="button" class="primary" id="detailClose">关闭</button>
      </div>
    </div>
  </div>
  <script>
    let board = [];
    let current = null;
    let revision = null;
    let pollTimer = null;
    const POLL_MS = 2500;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function escapeHtml(t) {
      return String(t ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let detailPlanPath = '';

    function openDetail(slice) {
      const modal = document.getElementById('detailModal');
      document.getElementById('detailTitle').textContent =
        `WBS ${slice.n} · ${slice.title || slice.label}`;
      document.getElementById('detailLead').textContent =
        slice.summary || '（暂无白话说明）';
      detailPlanPath = slice.related_plan || '';
      const rows = [
        ['Skill', slice.skill || '—'],
        ['输入', slice.input || '—'],
        ['输出', slice.output || '—'],
        ['验收', slice.acceptance || '—'],
        ['勾选文案', slice.label || '—'],
      ];
      if (detailPlanPath) rows.push(['关联 plan', detailPlanPath]);
      document.getElementById('detailBody').innerHTML = rows.map(([k, v]) =>
        `<div class="detail-row"><dt>${escapeHtml(k)}</dt><dd>${k === '关联 plan'
          ? `<code>${escapeHtml(v)}</code>`
          : escapeHtml(v)}</dd></div>`
      ).join('');
      document.getElementById('detailCopyPlan').style.display =
        detailPlanPath ? '' : 'none';
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeDetail() {
      const modal = document.getElementById('detailModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('detailClose').onclick = closeDetail;
    document.getElementById('detailModal').onclick = e => {
      if (e.target.id === 'detailModal') closeDetail();
    };
    document.getElementById('detailCopyPlan').onclick = async () => {
      if (!detailPlanPath) return;
      await navigator.clipboard.writeText(detailPlanPath);
      toast(`已复制 ${detailPlanPath}`);
    };
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDetail();
    });

    async function loadBoard(quiet) {
      const res = await fetch('/api/board');
      const payload = await res.json();
      const epics = Array.isArray(payload) ? payload : (payload.epics || []);
      revision = payload.revision ?? revision;
      board = epics;
      const sel = document.getElementById('epicSelect');
      const prev = current ? current.file : sel.value;
      sel.innerHTML = board.map(e => `<option value="${e.file}">${e.name}</option>`).join('');
      if (!board.length) {
        document.getElementById('app').innerHTML = '<div class="empty">Plans/Epic/ 下暂无 Epic。先实例化 Epic 母版。</div>';
        return;
      }
      const epicParam = new URLSearchParams(location.search).get('epic');
      if (epicParam && board.find(e => e.file === epicParam)) {
        current = board.find(e => e.file === epicParam);
      } else if (prev && board.find(e => e.file === prev)) {
        current = board.find(e => e.file === prev);
      } else if (!current || !board.find(e => e.file === current.file)) {
        current = board[0];
      }
      sel.value = current.file;
      render(current);
      const sub = document.querySelector('header .sub');
      if (sub && payload.updated_at) {
        sub.textContent = `markdown 为唯一真相 · 自动同步 ${payload.updated_at}${quiet ? '' : ''}`;
      }
    }

    async function pollRevision() {
      try {
        const res = await fetch('/api/revision');
        const data = await res.json();
        if (revision !== null && data.revision !== revision) {
          await loadBoard(true);
          toast('看板已同步 markdown 变更');
        } else if (revision === null) {
          revision = data.revision;
        }
      } catch (_) { /* server restarting */ }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollRevision, POLL_MS);
    }

    function sliceColumn(s, nextN, p0) {
      if (p0 > 0 && !s.done && s.n <= 2) return 'blocked';
      if (s.done) return 'done';
      if (s.n === nextN) return 'active';
      if (nextN && s.n > nextN) return 'todo';
      if (!nextN) return 'done';
      return 'todo';
    }

    function colTitle(key) {
      return { done: '已完成', active: '进行中', todo: '待开始', blocked: '阻塞' }[key];
    }

    function render(epic) {
      current = epic;
      const nextN = epic.next_slice;
      const gh = epic.gate_history;
      let gateHtml = '';
      if (gh && gh.last_gate) {
        const lg = gh.last_gate;
        const pass = lg.result === 'pass';
        const icon = pass ? '✅' : '⚠️';
        const verb = pass ? '通过' : '未过';
        const reason = (!pass && lg.reason) ? ` — ${lg.reason}` : '';
        const warn = (gh.consecutive_fails >= 2)
          ? ` <b style="color:var(--blocked)">·连续${gh.consecutive_fails}次未过</b>` : '';
        gateHtml = `<div class="meta gate-history" title="门禁事件账本回放${lg.reason ? '：' + lg.reason.replace(/"/g,'') : ''}">
          <span>${icon} <b>最近门禁</b> ${lg.at || '—'} ${verb}（${lg.stage || '—'}）${reason}${warn}</span>
        </div>`;
      }
      const cols = { done: [], active: [], todo: [], blocked: [] };
      (epic.slices || []).forEach(s => {
        cols[sliceColumn(s, nextN, epic.p0_open || 0)].push(s);
      });

      const plansRows = (epic.plans || []).map(p => {
        const st = p.status || '—';
        return `<tr>
          <td>${p.stage}</td>
          <td>${p.path ? `<code>${p.path}</code>` : '—'}</td>
          <td>${st}</td>
          <td>
            ${p.path ? `<select data-plan="${p.path}" class="statusSel">
              ${['草稿','进行中','评审中','已采纳','搁置'].map(x =>
                `<option ${x===st?'selected':''}>${x}</option>`).join('')}
            </select>` : '—'}
          </td>
        </tr>`;
      }).join('');

      const colHtml = ['todo','active','blocked','done'].map(key => `
        <div class="col">
          <h2>${colTitle(key)}</h2>
          ${cols[key].map(s => `
            <div class="card ${key}">
              <h3>WBS ${s.n}</h3>
              <p>${escapeHtml(s.title || s.label)}</p>
              ${s.summary ? `<p class="sub" style="margin-top:0.35rem;font-size:0.72rem">${escapeHtml(s.summary)}</p>` : ''}
              <div class="card-actions">
                <button type="button" data-detail="${s.n}">查看细节</button>
                ${!s.done ? `<button data-slice="${s.n}" data-done="1">完成</button>` : ''}
                ${s.done ? `<button data-slice="${s.n}" data-done="0">重开</button>` : ''}
              </div>
            </div>`).join('') || '<p class="sub">无</p>'}
        </div>`).join('');

      document.getElementById('app').innerHTML = `
        <div class="meta">
          <span><b>epic_id</b> ${epic.epic_id || '—'}</span>
          <span><b>阶段</b> ${epic.lifecycle_state}</span>
          <span><b>status</b> ${epic.status}</span>
          <span><b>p0_open</b> ${epic.p0_open}</span>
          <span><b>仓库</b> ${epic.repo || '—'} / ${epic.branch || '—'}</span>
          <span><b>下一切片</b> WBS ${nextN || '—'}</span>
        </div>
        ${gateHtml}
        <div class="grid">${colHtml}</div>
        <section>
          <h2>子 Plan 状态</h2>
          <table>
            <thead><tr><th>阶段</th><th>路径</th><th>status</th><th>改状态</th></tr></thead>
            <tbody>${plansRows}</tbody>
          </table>
        </section>`;

      document.querySelectorAll('[data-slice]').forEach(btn => {
        btn.onclick = () => toggleSlice(+btn.dataset.slice, btn.dataset.done === '1');
      });
      const sliceByN = Object.fromEntries((epic.slices || []).map(s => [s.n, s]));
      document.querySelectorAll('[data-detail]').forEach(btn => {
        btn.onclick = () => openDetail(sliceByN[+btn.dataset.detail]);
      });
      document.querySelectorAll('.statusSel').forEach(sel => {
        sel.onchange = () => setStatus(sel.dataset.plan, sel.value);
      });
    }

    async function toggleSlice(n, done) {
      await fetch('/api/slice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: current.file, slice: n, done, operator: 'web' })
      });
      toast(`WBS ${n} ${done ? '已完成' : '已重开'}`);
      await loadBoard();
      current = board.find(e => e.file === current.file);
      render(current);
    }

    async function setStatus(planPath, status) {
      await fetch('/api/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: planPath, status, epic: current.file, stage: '—', operator: 'web' })
      });
      toast(`${planPath} → ${status}`);
      await loadBoard();
      current = board.find(e => e.file === document.getElementById('epicSelect').value);
      render(current);
    }

    document.getElementById('refreshBtn').onclick = loadBoard;
    document.getElementById('epicSelect').onchange = e => {
      current = board.find(x => x.file === e.target.value);
      render(current);
    };
    document.getElementById('triggerBtn').onclick = async () => {
      const res = await fetch('/api/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: current.file })
      });
      const data = await res.json();
      await navigator.clipboard.writeText(data.command);
      toast(`已复制：${data.command}`);
    };

    loadBoard().then(() => {
      startPolling();
    }).catch(err => {
      document.getElementById('app').innerHTML = `<div class="empty">加载失败：${err.message}<br>请先运行 ./scripts/kanban-server.sh</div>`;
    });
  </script>
</body>
</html>
