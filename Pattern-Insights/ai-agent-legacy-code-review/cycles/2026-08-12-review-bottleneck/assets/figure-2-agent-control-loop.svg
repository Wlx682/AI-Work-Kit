<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101b31"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#26e0a4"/><stop offset="1" stop-color="#39a7ff"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#8c7cff"/><stop offset="1" stop-color="#d06cff"/></linearGradient>
    <filter id="s2"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#48d7b0"/></marker>
    <marker id="av" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#a77cff"/></marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg2)"/>
  <circle cx="420" cy="460" r="430" fill="#17d8a0" opacity=".035"/><circle cx="1320" cy="500" r="410" fill="#995cff" opacity=".045"/>
  <text x="90" y="105" fill="#f7fbff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="700">围绕 LLM 的不确定性重建控制闭环</text>
  <text x="92" y="154" fill="#91a8c3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24">精确控制的对象不是每一步答案，而是探索边界、完成证据、失败恢复与系统进化</text>

  <g filter="url(#s2)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="90" y="244" width="395" height="390" rx="32" fill="#10263a" stroke="#27657a"/>
    <rect x="603" y="244" width="395" height="390" rx="32" fill="#10243a" stroke="#376783"/>
    <rect x="1116" y="244" width="395" height="390" rx="32" fill="#241c3b" stroke="#66529b"/>
    <circle cx="157" cy="312" r="30" fill="#163d43" stroke="#31e0a7" stroke-width="3"/><text x="157" y="322" text-anchor="middle" fill="#49e8b6" font-size="28" font-weight="700">1</text>
    <circle cx="670" cy="312" r="30" fill="#18394d" stroke="#47b9ff" stroke-width="3"/><text x="670" y="322" text-anchor="middle" fill="#65c7ff" font-size="28" font-weight="700">2</text>
    <circle cx="1183" cy="312" r="30" fill="#34264d" stroke="#ad83ff" stroke-width="3"/><text x="1183" y="322" text-anchor="middle" fill="#c5a5ff" font-size="28" font-weight="700">3</text>
    <text x="210" y="322" fill="#fff" font-size="31" font-weight="700">生成与探索</text>
    <text x="723" y="322" fill="#fff" font-size="31" font-weight="700">证据与控制</text>
    <text x="1236" y="322" fill="#fff" font-size="31" font-weight="700">进化</text>
    <g fill="#c9d8e7" font-size="23">
      <text x="135" y="402">• 候选方案与分支轨迹</text><text x="135" y="452">• 补全未表达的意图</text><text x="135" y="502">• 在陌生环境中换路</text>
      <text x="648" y="402">• 输入、工具与产物留证</text><text x="648" y="452">• 副作用、预算与边界</text><text x="648" y="502">• 完成声明与恢复检查点</text>
      <text x="1161" y="402">• 聚合真实成败与漏判</text><text x="1161" y="452">• 生成控制策略候选</text><text x="1161" y="502">• 回放、比较、发布、回滚</text>
    </g>
    <rect x="128" y="554" width="320" height="46" rx="23" fill="#153c3d"/><text x="288" y="585" text-anchor="middle" fill="#74f2c7" font-size="21">发挥不确定性的价值</text>
    <rect x="641" y="554" width="320" height="46" rx="23" fill="#17364a"/><text x="801" y="585" text-anchor="middle" fill="#7bd2ff" font-size="21">限制错误的传播成本</text>
    <rect x="1154" y="554" width="320" height="46" rx="23" fill="#352649"/><text x="1314" y="585" text-anchor="middle" fill="#d6b9ff" font-size="21">让失败改变下一轮系统</text>
  </g>

  <path d="M485 438h90" stroke="url(#cyan)" stroke-width="6" marker-end="url(#a2)"/>
  <path d="M998 438h90" stroke="url(#cyan)" stroke-width="6" marker-end="url(#a2)"/>
  <path d="M1315 667C1315 810 287 810 287 667" fill="none" stroke="url(#violet)" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#av)"/>
  <text x="801" y="792" text-anchor="middle" fill="#c9b5ff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">经验证的变化回到下一轮探索；未经验证的变化不能直接改写系统</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="91" y="685" width="184" height="58" rx="20" fill="#101f31" stroke="#32506b"/><text x="183" y="722" text-anchor="middle" fill="#d9ebf8" font-size="21">可观测</text>
    <rect x="365" y="685" width="184" height="58" rx="20" fill="#101f31" stroke="#32506b"/><text x="457" y="722" text-anchor="middle" fill="#d9ebf8" font-size="21">后果有边界</text>
    <rect x="1051" y="685" width="184" height="58" rx="20" fill="#171f38" stroke="#554c84"/><text x="1143" y="722" text-anchor="middle" fill="#e3d9ff" font-size="21">失败可恢复</text>
    <rect x="1325" y="685" width="184" height="58" rx="20" fill="#171f38" stroke="#554c84"/><text x="1417" y="722" text-anchor="middle" fill="#e3d9ff" font-size="21">经验可进化</text>
  </g>
</svg>
