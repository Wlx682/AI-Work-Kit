<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c1c32"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#31e6a1"/><stop offset="1" stop-color="#19b8ff"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ffbd69"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#42dcb2"/></marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1390" cy="100" r="260" fill="#1476ff" opacity=".08"/><circle cx="180" cy="820" r="330" fill="#24d8a5" opacity=".06"/>
  <text x="92" y="104" fill="#f7fbff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="700">错误没有消失，只是迁移了</text>
  <text x="94" y="153" fill="#91a8c3" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24">局部断言持续变绿，系统级目标却可能悄无声息地偏离</text>

  <g filter="url(#shadow)">
    <rect x="90" y="230" width="420" height="430" rx="30" fill="#10243a" stroke="#264a68"/>
    <rect x="590" y="230" width="420" height="430" rx="30" fill="#10243a" stroke="#264a68"/>
    <rect x="1090" y="230" width="420" height="430" rx="30" fill="#1b2032" stroke="#6f4055"/>
  </g>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="132" y="292" fill="#7becc3" font-size="20" font-weight="700">01 代码层</text>
    <text x="132" y="342" fill="#fff" font-size="34" font-weight="700">代码断言失败</text>
    <text x="132" y="392" fill="#9fb4ca" font-size="23">编译 · 单测 · 静态检查</text>
    <g fill="#30e0a0"><circle cx="150" cy="472" r="20"/><circle cx="150" cy="535" r="20"/><circle cx="150" cy="598" r="20"/></g>
    <g fill="none" stroke="#071a18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M140 472l8 8 14-18"/><path d="M140 535l8 8 14-18"/><path d="M140 598l8 8 14-18"/></g>
    <g fill="#dce9f5" font-size="23"><text x="185" y="480">输入与状态不变量</text><text x="185" y="543">函数与模块行为</text><text x="185" y="606">已知边界条件</text></g>

    <text x="632" y="292" fill="#7becc3" font-size="20" font-weight="700">02 任务层</text>
    <text x="632" y="342" fill="#fff" font-size="34" font-weight="700">完成声明全绿</text>
    <text x="632" y="392" fill="#9fb4ca" font-size="23">方案 · 代码 · 测试 · Done</text>
    <path d="M650 500h280" fill="none" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/>
    <g fill="#152d36" stroke="#36e4aa" stroke-width="3"><circle cx="665" cy="500" r="25"/><circle cx="750" cy="500" r="25"/><circle cx="835" cy="500" r="25"/><circle cx="920" cy="500" r="25"/></g>
    <g fill="#37e3aa" font-size="22" font-weight="700"><text x="657" y="508">✓</text><text x="742" y="508">✓</text><text x="827" y="508">✓</text><text x="912" y="508">✓</text></g>
    <text x="648" y="577" fill="#dce9f5" font-size="23">每份产物内部自洽</text>
    <text x="648" y="615" fill="#8fa5bd" font-size="20">但它们可能共享同一个理解偏差</text>

    <text x="1132" y="292" fill="#ff9e8d" font-size="20" font-weight="700">03 系统层</text>
    <text x="1132" y="342" fill="#fff" font-size="34" font-weight="700">真实目标落空</text>
    <text x="1132" y="392" fill="#c4a5af" font-size="23">回归 · 合并 · 生产才暴露</text>
    <circle cx="1298" cy="505" r="108" fill="none" stroke="#3e6381" stroke-width="2" stroke-dasharray="9 11"/>
    <circle cx="1298" cy="505" r="52" fill="#173958" stroke="#4cc9f0" stroke-width="4"/>
    <circle cx="1420" cy="582" r="34" fill="#3e1724" stroke="#ff5671" stroke-width="5" filter="url(#glow)"/>
    <path d="M1168 472C1240 435 1280 455 1320 510S1370 575 1416 580" fill="none" stroke="url(#red)" stroke-width="8" stroke-dasharray="13 10"/>
    <text x="1195" y="650" fill="#ffbdad" font-size="21">局部正确 ≠ 系统正确</text>
  </g>

  <path d="M510 445h58" stroke="#42dcb2" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1010 445h58" stroke="#42dcb2" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="90" y="725" width="1420" height="92" rx="24" fill="#0c1727" stroke="#233d56"/>
  <text x="800" y="782" text-anchor="middle" fill="#e6f6ff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="700">新的审查瓶颈：不是人审得不够快，而是系统错得不够早</text>
</svg>
