<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent 生产控制闭环</title>
  <desc id="desc">观测目标证据与行动，重建状态，判断风险，执行控制动作，核对现实结果，并将反馈送回状态镜像。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset="1" stop-color="#0b2037"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c5c"/>
      <stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#59d7e8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f3b44b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020812" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <text x="100" y="95" fill="#eef8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="46" font-weight="700">监控不是旁观，而是生产控制闭环</text>
  <text x="102" y="145" fill="#8fb4ce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="25">每一步都必须改变下一项控制决定，并最终由现实结果校准</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(90 245)">
      <rect width="230" height="150" rx="24" fill="url(#node)" stroke="#3aa6c8" stroke-width="2"/>
      <text x="115" y="61" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">观测目标、证据</text>
      <text x="115" y="102" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">与行动</text>
    </g>
    <g transform="translate(390 245)">
      <rect width="230" height="150" rx="24" fill="url(#node)" stroke="#3aa6c8" stroke-width="2"/>
      <text x="115" y="61" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">重建当前</text>
      <text x="115" y="102" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">系统状态</text>
    </g>
    <g transform="translate(690 245)">
      <rect width="230" height="150" rx="24" fill="url(#node)" stroke="#3aa6c8" stroke-width="2"/>
      <text x="115" y="61" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">判断偏差</text>
      <text x="115" y="102" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">与剩余风险</text>
    </g>
    <g transform="translate(990 245)">
      <rect width="230" height="150" rx="24" fill="#4a3218" stroke="#f3b44b" stroke-width="2.5"/>
      <text x="115" y="50" fill="#fff4dc" font-size="25" font-weight="650" text-anchor="middle">允许 · 缩权</text>
      <text x="115" y="88" fill="#fff4dc" font-size="25" font-weight="650" text-anchor="middle">暂停 · 隔离</text>
      <text x="115" y="124" fill="#f3c66f" font-size="20" text-anchor="middle">行动网关真正执行</text>
    </g>
    <g transform="translate(1290 245)">
      <rect width="230" height="150" rx="24" fill="url(#node)" stroke="#3aa6c8" stroke-width="2"/>
      <text x="115" y="61" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">核对现实</text>
      <text x="115" y="102" fill="#eaf8ff" font-size="27" font-weight="650" text-anchor="middle">最终结果</text>
    </g>
  </g>

  <g fill="none" stroke="#59d7e8" stroke-width="5" marker-end="url(#arrow)">
    <path d="M320 320 H378"/>
    <path d="M620 320 H678"/>
    <path d="M920 320 H978"/>
  </g>
  <path d="M1220 320 H1278" fill="none" stroke="#f3b44b" stroke-width="5" marker-end="url(#arrowAmber)"/>
  <path d="M1405 405 V555 Q1405 610 1350 610 H505 Q450 610 450 555 V420" fill="none" stroke="#59d7e8" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="650" y="565" width="560" height="90" rx="45" fill="#0b2b43" stroke="#2e799b" stroke-width="2"/>
  <text x="930" y="621" fill="#bfefff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="600" text-anchor="middle">现实反馈刷新镜像，下一次控制不再依据旧世界</text>
</svg>
